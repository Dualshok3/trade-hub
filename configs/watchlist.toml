# Feste Watchlist. Nicht während eines laufenden Vergleichs ändern, sonst sind die Läufe nicht vergleichbar.
#
# symbol   – Symbol bei Yahoo Finance (Kursquelle)
# exchange – XETRA, NYSE oder NASDAQ (bestimmt die Handelszeiten)
# kind     – stock oder etf (wichtig für Steuern: Teilfreistellung bei Aktien-ETFs)
# aliases  – Namen, unter denen der Wert in News vorkommt (ganze Wörter; kurze Großbuchstaben-Kürzel wie SAP
#            nur genau so geschrieben, sonst Groß-/Kleinschreibung egal)
# exclude  – ähnliche Namen anderer Firmen, die nicht dieser Wert sind
# news     – Suchbegriff für den News-Feed

[[asset]]
id = "SAP"
symbol = "SAP.DE"
name = "SAP SE"
exchange = "XETRA"
currency = "EUR"
kind = "stock"
aliases = ["SAP"]
news = "SAP Aktie"

