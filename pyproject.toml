[project]
name = "trading-agent"
version = "0.1.0"
description = "LangGraph-Trading-Agent mit lokalem Modell (crit) gegen Claude Opus – Musterdepot mit Spielgeld"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "yfinance>=0.2.50",
    "feedparser>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "tzdata>=2024.1",
    "langgraph>=1.2.24",
    "harness-it-all",
]

[project.scripts]
trading-agent = "trading_agent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_agent"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]  # deutsche Typografie; B008: typer.Option als Default

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: braucht Internet (yfinance, RSS); in CI abgewählt"]
addopts = "-m 'not network'"

[tool.uv.sources]
harness-it-all = { git = "https://github.com/Dualshok3/harness-it-all", rev = "bbca140" }

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # RSS-Beispiele mit langen Zeilen
